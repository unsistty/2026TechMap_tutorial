name: Deploy DocC to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -project WindGarden.xcodeproj \
            -scheme WindGarden \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Transform for static hosting
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$(find .build/DerivedData/Build/Products -name 'WindGarden.doccarchive' -type d -print -quit)"
          test -n "$ARCHIVE_PATH"
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p .build/site
          xcrun docc process-archive transform-for-static-hosting \
            "$ARCHIVE_PATH" \
            --output-path .build/site \
            --hosting-base-path "$REPOSITORY_NAME"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
